<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐视频下载器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 560px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 36px 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 28px;
  }

  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.35); }
  input[type="text"]:focus { border-color: #6c8cff; }

  .btn-paste {
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .btn-paste:hover { background: rgba(255, 255, 255, 0.15); }

  .format-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }

  .format-option {
    flex: 1;
    position: relative;
  }

  .format-option input { position: absolute; opacity: 0; }

  .format-option label {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.2);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .format-option input:checked + label {
    border-color: #6c8cff;
    background: rgba(108, 140, 255, 0.2);
    color: #a8bcff;
  }

  .btn-download {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6c8cff, #8b5cf6);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-download:hover { opacity: 0.9; }
  .btn-download:active { transform: scale(0.98); }
  .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }

  .status.show { display: block; }
  .status.info { background: rgba(108, 140, 255, 0.15); border: 1px solid rgba(108, 140, 255, 0.3); }
  .status.error { background: rgba(255, 90, 90, 0.15); border: 1px solid rgba(255, 90, 90, 0.3); color: #ff9b9b; }
  .status.success { background: rgba(80, 220, 140, 0.15); border: 1px solid rgba(80, 220, 140, 0.3); color: #8ef0b8; }

  .result-link {
    display: inline-block;
    margin-top: 8px;
    color: #a8bcff;
    text-decoration: none;
    font-weight: 600;
  }
  .result-link:hover { text-decoration: underline; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <h1>🎵 音乐视频下载器</h1>
  <p class="subtitle">粘贴链接，选择格式，一键下载</p>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="粘贴音乐或视频链接…">
    <button class="btn-paste" id="pasteBtn">粘贴</button>
  </div>

  <div class="format-row">
    <div class="format-option">
      <input type="radio" name="format" id="fmtMp3" value="mp3" checked>
      <label for="fmtMp3">MP3 音频</label>
    </div>
    <div class="format-option">
      <input type="radio" name="format" id="fmtMp4" value="mp4">
      <label for="fmtMp4">MP4 视频</label>
    </div>
  </div>

  <button class="btn-download" id="downloadBtn">开始下载</button>

  <div class="status" id="status"></div>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const pasteBtn = document.getElementById('pasteBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');

  // 粘贴按钮
  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) urlInput.value = text.trim();
    } catch (e) {
      setStatus('error', '无法读取剪贴板，请手动粘贴。');
    }
  });

  // 显示状态
  function setStatus(type, html) {
    statusEl.className = 'status show ' + type;
    statusEl.innerHTML = html;
  }

  function clearStatus() {
    statusEl.className = 'status';
    statusEl.innerHTML = '';
  }

  // 简单的链接校验
  function isValidUrl(str) {
    try {
      const u = new URL(str);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch { return false; }
  }

  // 下载按钮
  downloadBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    const format = document.querySelector('input[name="format"]:checked').value;

    if (!url) {
      setStatus('error', '请先粘贴一个链接。');
      return;
    }

    if (!isValidUrl(url)) {
      setStatus('error', '链接格式不正确，请检查后重试。');
      return;
    }

    downloadBtn.disabled = true;
    setStatus('info', '<span class="spinner"></span>正在解析链接，请稍候…');

    try {
      // ⬇️ 这里换成你后端的接口地址
      const res = await fetch('/api/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format })
      });

      if (!res.ok) throw new Error('解析失败');

      const data = await res.json();

      if (data.downloadUrl) {
        setStatus('success',
          `解析成功！<br><a class="result-link" href="${data.downloadUrl}" target="_blank" download>点击下载 ${format.toUpperCase()}</a>`
        );
      } else {
        setStatus('error', data.message || '未获取到下载地址。');
      }
    } catch (err) {
      setStatus('error', '解析失败，请确认链接有效，或稍后再试。');
    } finally {
      downloadBtn.disabled = false;
    }
  });

  // 回车直接触发下载
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') downloadBtn.click();
  });
</script>

</body>
</html>
